<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Open Seasons</title>
  <link rel="stylesheet" href="/app-link-fallback.css">
  <script type="module" src="/app-link-fallback.mjs"></script>
</head>
<body>
  <main>
    <img class="logo" src="/seasonslogo.png" alt="Seasons">
    <h1 data-title>Open in Seasons</h1>
    <p data-message>Continue in Seasons to view this link.</p>
    <div class="actions">
      <a class="button" data-open-seasons href="#">Open Seasons</a>
      <a class="button secondary" data-app-store href="#">Get Seasons on the App Store</a>
    </div>
  </main>
</body>
</html>
